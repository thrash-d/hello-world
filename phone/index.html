<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f5f8b">
<title>hello-world</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --fg: #1b1b1b; --bg: #fbfaf7; --muted: #5d5d5d; --accent: #1f5f8b; --done: #2e7d32; --card: #ffffff; --line: #ddd8cf; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f1efe9; --bg: #17191c; --muted: #b5b0a6; --accent: #7cc0ef; --done: #7fd18a; --card: #22252a; --line: #3a3d42; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 34rem; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.6rem; margin: .2rem 0 0; }
  .date { color: var(--muted); margin: 0 0 1rem; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 0 0 14px; }
  h2 { font-size: 1.05rem; margin: 0 0 .5rem; }
  .plan { font-size: 1.15rem; font-weight: 600; margin: 0 0 .8rem; overflow-wrap: anywhere; }
  .buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  button { font: inherit; font-weight: 700; min-height: 64px; border-radius: 12px; border: 2px solid var(--accent); background: transparent; color: var(--accent); padding: 8px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--bg); }
  button.done { border-color: var(--done); background: var(--done); color: var(--bg); }
  input[type=text] { width: 100%; font: inherit; padding: 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); margin: 0 0 10px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .note { color: var(--muted); font-size: .95rem; margin: .4rem 0 0; }
  .status { min-height: 1.5em; font-weight: 600; margin: 0 0 12px; }
  details summary { cursor: pointer; color: var(--accent); font-weight: 600; min-height: 44px; display: flex; align-items: center; }
  label { display: block; margin: .6rem 0 .3rem; }
  select { font: inherit; padding: 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }
  .wide { width: 100%; margin-top: 10px; }
  .picks { display: grid; gap: 10px; }
  a.button { display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 700; min-height: 64px; border-radius: 12px; border: 2px solid var(--accent); color: var(--accent); text-decoration: none; padding: 8px; }
  #fridge { display: none; }
  body.large { font-size: 24px; }
  body.large button, body.large a.button { min-height: 80px; }
  .small-button { min-height: 44px; font-size: .95rem; }
  [hidden] { display: none !important; }
  /* The fridge page: only the day, the plan and the daily repeat, big. */
  @media print {
    main > *:not(#fridge) { display: none !important; }
    body { background: #fff; color: #000; }
    #fridge { display: block !important; border: 0; }
    #fridge h2 { font-size: 28pt; }
    #fridge .big { font-size: 40pt; font-weight: 700; margin: 0 0 24pt; overflow-wrap: anywhere; }
    #fridge .note { font-size: 12pt; color: #000; }
  }
</style>
</head>
<body>
<main>
  <h1 id="hello">Hello, world!</h1>
  <p class="date" id="date"></p>
  <p><button class="small-button" id="large"></button></p>
  <p class="status" id="status" role="status" aria-live="polite"></p>

  <section id="ask" hidden>
    <h2 id="ask-label"></h2>
    <p class="plan" id="ask-plan"></p>
    <div class="buttons">
      <button class="done" id="yes"></button>
      <button id="no"></button>
      <button id="skip"></button>
    </div>
    <button class="wide" id="sideways"></button>
    <div class="row" id="fork" hidden style="margin-top:10px">
      <button class="primary" id="carry-it"></button>
      <button id="aside-it"></button>
    </div>
  </section>

  <section id="smaller-offer" hidden>
    <h2 id="coming-back"></h2>
    <input type="text" id="smaller-input" maxlength="200" autocomplete="off">
    <div class="buttons">
      <button class="primary" id="make-smaller"></button>
      <button id="aside-smaller"></button>
      <button id="keep-it"></button>
    </div>
  </section>

  <section id="today">
    <h2 id="today-label"></h2>
    <p class="plan" id="today-plan" hidden></p>
    <div class="row" id="today-buttons" hidden>
      <button class="done" id="did"></button>
      <button id="clear"></button>
    </div>
    <p class="note" id="smaller-nudge" hidden></p>
    <form id="plan-form">
      <input type="text" id="plan-input" maxlength="200" autocomplete="off" enterkeyhint="done">
      <button class="primary" id="save" type="submit"></button>
    </form>
    <div id="picks" hidden>
      <p class="note" id="picks-label"></p>
      <div class="picks" id="picks-list"></div>
    </div>
    <p class="note" id="repeat-today" hidden></p>
    <button class="wide" id="end-day" hidden></button>
    <div id="end-panel" hidden>
      <div id="end-list"></div>
      <button class="primary wide" id="end-close"></button>
    </div>
  </section>

  <section id="family-buttons" hidden>
    <div class="row">
      <a class="button" id="draft" href="#"></a>
      <a class="button" id="call" href="#"></a>
    </div>
    <p class="note" id="family-scam"></p>
  </section>

  <section id="letters">
    <h2 id="letters-label"></h2>
    <p class="note" id="letters-note"></p>
    <label for="letter-to" id="letter-to-label"></label>
    <input type="text" id="letter-to" maxlength="100" autocomplete="off">
    <label for="letter-text" id="letter-text-label"></label>
    <textarea id="letter-text" maxlength="4000" rows="5" style="width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)"></textarea>
    <p><label><input type="checkbox" id="letter-keep"> <span id="letter-keep-label"></span></label></p>
    <div class="buttons">
      <button id="letter-save"></button>
      <button class="primary" id="letter-mail"></button>
      <button id="letter-sms"></button>
    </div>
    <div id="letter-list"></div>
    <p><button id="letters-clear" hidden></button></p>
  </section>

  <section id="house">
    <h2 id="house-label"></h2>
    <p class="note" id="house-intro"></p>
    <form id="house-join" hidden>
      <label for="house-code" id="house-code-label"></label>
      <input type="text" id="house-code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxxx-xxxxx-xxxxx-xxxxx-xxxxx">
      <label for="house-name" id="house-name-label"></label>
      <input type="text" id="house-name" maxlength="40" autocomplete="off">
      <button class="primary" id="house-join-button" type="submit"></button>
    </form>
    <div id="house-on" hidden>
      <p class="note" id="house-offline" hidden></p>
      <div id="house-news"></div>
      <div id="house-rekey" hidden>
        <p id="house-rekey-text"></p>
        <div class="row"><button class="primary" id="house-rekey-yes"></button><button id="house-rekey-no"></button></div>
      </div>
      <div id="house-items"></div>
      <form id="house-add"><input type="text" id="house-add-text" maxlength="200" autocomplete="off"><button id="house-add-button" type="submit"></button></form>
      <details><summary id="house-removed-label"></summary><div id="house-removed"></div></details>
      <p><button id="house-leave"></button></p>
    </div>
  </section>

  <section>
    <h2 id="thought-label"></h2>
    <p id="thought"></p>
    <h2 id="tip-label"></h2>
    <p id="tip"></p>
  </section>

  <section>
    <details>
      <summary id="settings-label"></summary>
      <label for="language" id="language-label"></label>
      <select id="language"></select>
      <label for="remind" id="remind-label"></label>
      <select id="remind"></select>
      <p class="note" id="remind-note"></p>
      <label for="day-start" id="day-start-label"></label>
      <select id="day-start"></select>
      <p class="note" id="day-start-note"></p>
      <h2 id="repeat-label" style="margin-top:1rem"></h2>
      <form id="repeat-form">
        <input type="text" id="repeat-text" maxlength="200" autocomplete="off">
        <label for="repeat-at" id="repeat-at-label"></label>
        <select id="repeat-at"></select>
        <p><button id="repeat-save" type="submit"></button></p>
      </form>
      <p class="note" id="repeat-note"></p>
      <h2 id="family-label" style="margin-top:1rem"></h2>
      <form id="family-form">
        <label for="family-name" id="family-name-label"></label>
        <input type="text" id="family-name" maxlength="40" autocomplete="off">
        <label for="family-number" id="family-number-label"></label>
        <input type="text" id="family-number" inputmode="tel" maxlength="25" autocomplete="off">
        <p><button id="family-save" type="submit"></button></p>
      </form>
      <p class="note" id="family-note"></p>
      <p><button id="print"></button></p>
      <p class="note" id="print-note"></p>
      <p><button id="export"></button></p>
      <h2 id="sync-label" style="margin-top:1rem"></h2>
      <p class="note" id="sync-scam"></p>
      <label for="sync-code" id="sync-code-label"></label>
      <input type="text" id="sync-code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="xxxxx-xxxxx-xxxxx-xxxxx-xxxxx">
      <p><button id="sync-save"></button> <button id="sync-change" hidden></button></p>
      <p class="note" id="sync-note"></p>
      <p class="note" id="sync-last"></p>
      <p class="note" id="sync-devices"></p>
      <div id="device-row" hidden>
        <label for="device-name" id="device-name-label"></label>
        <input type="text" id="device-name" maxlength="40" autocomplete="off">
        <p><button id="device-save"></button></p>
      </div>
      <p><button id="forget"></button></p>
    </details>
    <p class="note" id="privacy"></p>
  </section>

  <section id="fridge">
    <h2 id="fridge-title"></h2>
    <p class="big" id="fridge-plan"></p>
    <p class="big" id="fridge-repeat"></p>
    <p class="note" id="fridge-note"></p>
  </section>
</main>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
