# Builds the offline install package for each new version on main and
# publishes it as a GitHub release. The release notes carry the package hash,
# which IT passes to install.ps1 -PackageHash. Runs once the tests have
# passed on a push to main, so no release comes from a commit that failed
# them, and not on the tag, which another workflow's token pushes.
name: release

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    # By hand only from main, and otherwise only once the tests passed there.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Build and publish the package if this version has no release yet
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION).Trim()
          $tag = "v$version"
          # Asked through stdout: in Windows PowerShell 5.1 with 'Stop', any
          # stderr text from a native command, such as "release not found",
          # ends the script.
          $existing = @(gh release list -R $env:REPO --limit 200 --json tagName -q '.[].tagName')
          if ($LASTEXITCODE) { throw "gh release list failed with exit $LASTEXITCODE" }
          if ($existing -contains $tag) { Write-Host "$tag already has a release."; exit 0 }
          # gh release create reuses an existing tag wherever it points, so a
          # package from this commit would go out under another commit's tag.
          $tagged = & cmd /d /c "gh api repos/$env:REPO/commits/$tag --jq .sha 2>nul"
          if ($LASTEXITCODE) { $tagged = $null }
          if ($tagged -and $tagged -ne $env:SHA) { throw "$tag points at $tagged, not $env:SHA. Bump VERSION for this commit." }
          $out = Join-Path $env:RUNNER_TEMP "hello-world-$version"
          $hash = (powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-package.ps1 -OutDir $out | Select-Object -Last 1).Trim()
          if ($hash -notmatch '^[0-9a-f]{64}$') { throw "The build printed no package hash: $hash" }
          $zip = Join-Path $env:RUNNER_TEMP "hello-world-$version.zip"
          Compress-Archive -Path "$out\*" -DestinationPath $zip
          $portable = Join-Path $env:RUNNER_TEMP "hello-world-portable-$version.zip"
          $portableHash = (powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-portable.ps1 -OutFile $portable | Select-Object -Last 1).Trim()
          if ($portableHash -notmatch '^[0-9a-f]{64}$') { throw "The portable build printed no hash: $portableHash" }
          $notes = @"
          Offline install package for hello-world $version, built from commit $env:SHA.

          Package hash (SHA-256 of SHA256SUMS): ``$hash``

          Unzip into a folder only administrators can write, then run as administrator or SYSTEM:

          ``````
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -PackageHash $hash -Quiet
          ``````

          ``sbom.cdx.json`` is the CycloneDX bill of materials.

          ``hello-world-portable-$version.zip`` (SHA-256 ``$portableHash``) runs with no install on a personal PC: unzip, then double-click ``Start hello-world.cmd``. On a work PC, ask IT to deploy the package above instead.
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          # UTF-8 without a byte-order mark, which Set-Content -Encoding utf8
          # adds in Windows PowerShell 5.1 and GitHub shows at the top.
          [IO.File]::WriteAllText($notesFile, ($notes -replace '(?m)^          ', ''), (New-Object Text.UTF8Encoding $false))
          gh release create $tag $zip $portable (Join-Path $out 'sbom.cdx.json') -R $env:REPO --target $env:SHA --title "hello-world $version" --notes-file $notesFile
          if ($LASTEXITCODE) { throw "gh release create failed with exit $LASTEXITCODE" }
