# Runs the test suite on Windows, where the program ships, and on Linux, with
# the oldest and newest Python it supports. Actions are pinned to a commit and
# tools to a version, so a moved tag or a new release can't change what runs.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python test_hello.py
      - run: |
          python -m pip install pytest==9.1.1
          python -m pytest -q test_hello.py

  powershell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse and lint the scripts under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in 'install.ps1', 'uninstall.ps1', 'tools\build-package.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors) { $errors | Out-String | Write-Host; throw "$f does not parse." }
          }
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $found = foreach ($f in 'install.ps1', 'uninstall.ps1', 'tools\build-package.ps1') { Invoke-ScriptAnalyzer -Path $f -Severity Error }
          if ($found) { $found | Format-Table -AutoSize | Out-String | Write-Host; throw 'PSScriptAnalyzer found errors.' }
      # The runner is an administrator, so the package really installs here:
      # the same package the release workflow publishes, built the same way.
      - name: Install, reinstall, refuse, retry and uninstall the package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pf = [Environment]::GetFolderPath('ProgramFiles')
          $dir = Join-Path $pf 'hello-world'
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\hello-world'
          $version = (Get-Content VERSION).Trim()
          $built = Join-Path $env:RUNNER_TEMP 'package'
          $hash = (powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-package.ps1 -OutDir $built | Select-Object -Last 1).Trim()
          $setup = Join-Path $pf 'hello-setup'
          New-Item -ItemType Directory $setup | Out-Null
          icacls $setup /inheritance:r /grant:r '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-18:(OI)(CI)F' | Out-Null
          Copy-Item "$built\*" $setup
          function Install([string]$Hash) {
            powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $setup 'install.ps1') -PackageHash $Hash -Quiet | Write-Host
            return $LASTEXITCODE
          }
          function Check([bool]$Ok, [string]$What) { if (-not $Ok) { throw "Failed: $What" }; Write-Host "ok: $What" }

          Check ((Install $hash) -eq 0) 'a clean install exits 0'
          $entry = Get-ItemProperty $key
          Check ($entry.DisplayVersion -eq $version -and $entry.PackageHash -eq $hash) 'the Apps entry records the version and package hash'
          $ran = & "$dir\python\python.exe" -I "$dir\hello.py" --plain 2>&1
          Write-Host "hello.py --plain said: $ran (exit $LASTEXITCODE)"
          Check ("$ran" -eq 'Hello, world!') 'the installed program runs'
          Check (-not (Get-ChildItem "$dir\python" -Filter 'libssl-*.dll')) 'OpenSSL is stripped from the bundled Python'
          Check (Test-Path "$env:WINDIR\Logs\hello-world\install.log") 'the log is in Windows\Logs'
          Check ([bool](Get-EventLog -LogName Application -Source 'hello-world' -InstanceId 1000 -Newest 1)) 'the install is in the event log'

          Check ((Install $hash) -eq 0) 'a reinstall exits 0'
          Check ((Install ('0' * 64)) -eq 1) 'a wrong package hash is refused'
          Check ((Get-ItemProperty $key).PackageHash -eq $hash) 'a refused install changes nothing'

          Set-ItemProperty $key -Name DisplayVersion -Value '99.0.0'
          Check ((Install $hash) -eq 1) 'a downgrade is refused'
          Set-ItemProperty $key -Name DisplayVersion -Value $version

          $busy = Start-Process "$dir\python\python.exe" -ArgumentList '-I -c "import time; time.sleep(120)"' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          Check (-not $busy.HasExited) 'the stand-in window is running'
          try { Check ((Install $hash) -eq 1618) 'an open window gives 1618' }
          finally { Stop-Process -Id $busy.Id -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2 }
          Check (Test-Path "$dir\hello.cmd") 'the install is still there after 1618'

          powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\uninstall.ps1" -Quiet | Write-Host
          Check ($LASTEXITCODE -eq 0) 'uninstall exits 0'
          Check (-not (Test-Path $dir) -and -not (Test-Path $key)) 'uninstall removes the folder and the Apps entry'
      # A dead URL or a wrong hash would pass every other check and fail every
      # real install at step 4, so run what the installer will run.
      - name: Check the pinned Python and run hello.py on it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Get-Content -Raw install.ps1
          $url = [regex]::Match($src, "(?m)^\`$pyUrl = '([^']+)'").Groups[1].Value
          $sha = [regex]::Match($src, "(?m)^\`$pySha256 = '([0-9A-Fa-f]{64})'").Groups[1].Value
          if (-not $url -or -not $sha) { throw 'Could not read $pyUrl and $pySha256 from install.ps1.' }
          $zip = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          Invoke-WebRequest $url -OutFile $zip -UseBasicParsing
          if ((Get-FileHash -LiteralPath $zip).Hash -ne $sha) { throw "The download from $url doesn't match the pinned SHA-256." }
          $py = Join-Path $env:RUNNER_TEMP 'python'
          Expand-Archive -LiteralPath $zip -DestinationPath $py
          $out = & (Join-Path $py 'python.exe') -I hello.py --plain
          if ($LASTEXITCODE -or "$out" -ne 'Hello, world!') { throw "hello.py --plain on the pinned Python gave exit $LASTEXITCODE`: $out" }
          $version = & (Join-Path $py 'python.exe') -I hello.py --version
          if ($version -ne "hello-world $((Get-Content VERSION).Trim())") { throw "--version gave '$version'." }
