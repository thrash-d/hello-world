# Runs the test suite on Windows, where the program ships, and on Linux, with
# the oldest and newest Python it supports. Actions are pinned to a commit and
# tools to a version, so a moved tag or a new release can't change what runs.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python test_hello.py
      - run: |
          python -m pip install pytest==9.1.1
          python -m pytest -q test_hello.py

  powershell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse and lint the scripts under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in 'install.ps1', 'uninstall.ps1', 'install-user.ps1', 'uninstall-user.ps1', 'tools\build-package.ps1', 'tools\reinstall.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors) { $errors | Out-String | Write-Host; throw "$f does not parse." }
          }
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $found = foreach ($f in 'install.ps1', 'uninstall.ps1', 'install-user.ps1', 'uninstall-user.ps1', 'tools\build-package.ps1', 'tools\reinstall.ps1') { Invoke-ScriptAnalyzer -Path $f -Severity Error }
          if ($found) { $found | Format-Table -AutoSize | Out-String | Write-Host; throw 'PSScriptAnalyzer found errors.' }
      # The runner is an administrator, so the package really installs here:
      # the same package the release workflow publishes, built the same way.
      - name: Install, reinstall, refuse, retry and uninstall the package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pf = [Environment]::GetFolderPath('ProgramFiles')
          $dir = Join-Path $pf 'hello-world'
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\hello-world'
          $version = (Get-Content VERSION).Trim()
          $built = Join-Path $env:RUNNER_TEMP 'package'
          $hash = (powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-package.ps1 -OutDir $built | Select-Object -Last 1).Trim()
          $setup = Join-Path $pf 'hello-setup'
          New-Item -ItemType Directory $setup | Out-Null
          icacls $setup /inheritance:r /grant:r '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-18:(OI)(CI)F' | Out-Null
          Copy-Item "$built\*" $setup
          function Install([string]$Hash) {
            powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $setup 'install.ps1') -PackageHash $Hash -Quiet | Write-Host
            return $LASTEXITCODE
          }
          function Check([bool]$Ok, [string]$What) { if (-not $Ok) { throw "Failed: $What" }; Write-Host "ok: $What" }

          Check ((Install $hash) -eq 0) 'a clean install exits 0'
          $entry = Get-ItemProperty $key
          Check ($entry.DisplayVersion -eq $version -and $entry.PackageHash -eq $hash) 'the Apps entry records the version and package hash'
          $ran = & "$dir\python\python.exe" -I "$dir\hello.py" --plain 2>&1
          Write-Host "hello.py --plain said: $ran (exit $LASTEXITCODE)"
          Check ("$ran" -eq 'Hello, world!') 'the installed program runs'
          $langs = & "$dir\python\python.exe" -I -c "import sys; sys.path.insert(0, sys.argv[1]); import hello; print(len(hello.LANGUAGES))" $dir
          Check ("$langs" -eq "$(@(Get-ChildItem 'hello.*.json').Count)") 'the installed program loads every translation'

          # A standard user runs it, and can't change the install.
          $pw = 'Hw-' + [guid]::NewGuid().ToString('N').Substring(0, 20) + 'aA1!'
          $secure = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser 'hwsmoke' -Password $secure -AccountNeverExpires | Out-Null
          try {
            $cred = [pscredential]::new("$env:COMPUTERNAME\hwsmoke", $secure)
            $outFile = 'C:\Users\Public\hw-plain.txt'
            $p = Start-Process "$dir\python\python.exe" -ArgumentList "-I `"$dir\hello.py`" --plain" -Credential $cred -LoadUserProfile -RedirectStandardOutput $outFile -WorkingDirectory 'C:\Users\Public' -Wait -PassThru
            Check ($p.ExitCode -eq 0 -and "$(Get-Content $outFile)" -eq 'Hello, world!') 'a standard user runs it'
            $p = Start-Process powershell -ArgumentList "-NoProfile -Command `"try { Set-Content -LiteralPath '$dir\planted.txt' -Value x -ErrorAction Stop; exit 0 } catch { exit 7 }`"" -Credential $cred -LoadUserProfile -WorkingDirectory 'C:\Users\Public' -Wait -PassThru
            Check ($p.ExitCode -eq 7 -and -not (Test-Path "$dir\planted.txt")) "a standard user can't change the install"
          }
          finally { Remove-LocalUser 'hwsmoke' -ErrorAction SilentlyContinue }
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'hello-world.lnk'))
          Check ($lnk.TargetPath -eq "$dir\python\pythonw.exe" -and $lnk.Arguments -eq "-I `"$dir\hello.py`" --window") 'the shortcut opens the window through pythonw.exe'
          # The embeddable Python draws the window, which closes itself after a moment.
          $drawn = & "$dir\python\python.exe" -I -c "import sys, tempfile; sys.path.insert(0, sys.argv[1]); import hello; hello.HOME = tempfile.mkdtemp(); hello.CLOSE_WINDOW_AFTER = 500; hello.WINDOW = True; w = hello.Window(hello.Visit()); w.run(); print('drawn' if w.error is None else w.error)" $dir 2>&1
          Check ("$drawn" -eq 'drawn') "the installed Python draws the window ($drawn)"
          Check (-not (Get-ChildItem "$dir\python" -Filter 'libssl-*.dll')) 'OpenSSL is stripped from the bundled Python'
          Check (Test-Path "$env:WINDIR\Logs\hello-world\install.log") 'the log is in Windows\Logs'
          Check ([bool](Get-EventLog -LogName Application -Source 'hello-world' -InstanceId 1000 -Newest 1)) 'the install is in the event log'

          Check ((Install $hash) -eq 0) 'a reinstall exits 0'
          Check ((Install ('0' * 64)) -eq 1) 'a wrong package hash is refused'
          Check ((Get-ItemProperty $key).PackageHash -eq $hash) 'a refused install changes nothing'

          Set-ItemProperty $key -Name DisplayVersion -Value '99.0.0'
          Check ((Install $hash) -eq 1) 'a downgrade is refused'
          Set-ItemProperty $key -Name DisplayVersion -Value $version

          # A running window doesn't block an upgrade: its copy is renamed
          # aside and keeps running, and the next install clears it.
          $busy = Start-Process "$dir\python\python.exe" -ArgumentList '-I -c "import time; time.sleep(120)"' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          Check (-not $busy.HasExited) 'the stand-in window is running'
          try { Check ((Install $hash) -eq 0) 'an upgrade works while a window is open' }
          finally { Stop-Process -Id $busy.Id -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2 }
          Check ((Install $hash) -eq 0 -and -not (Test-Path "$dir.old")) 'the next install clears the old copy'

          # A file held open without delete sharing does block it.
          $held = [IO.File]::Open("$dir\hello.py", 'Open', 'Read', 'Read')
          try {
            Check ((Install $hash) -eq 1618) 'a file in use gives 1618'
            Check (Test-Path "$dir\hello.cmd") 'the install is still there after 1618'
            powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\uninstall.ps1" -Quiet | Write-Host
            Check ($LASTEXITCODE -eq 1618 -and (Test-Path "$dir\hello.cmd")) 'uninstall gives 1618 and changes nothing'
          }
          finally { $held.Close() }

          powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\uninstall.ps1" -Quiet | Write-Host
          Check ($LASTEXITCODE -eq 0) 'uninstall exits 0'
          Check (-not (Test-Path $dir) -and -not (Test-Path $key)) 'uninstall removes the folder and the Apps entry'

          # The same package with the sample organization content in it.
          $withContent = Join-Path $env:RUNNER_TEMP 'package-content'
          $contentHash = (powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-package.ps1 -OutDir $withContent -ContentFile examples\content.json | Select-Object -Last 1).Trim()
          Get-ChildItem $setup | Remove-Item -Force
          Copy-Item "$withContent\*" $setup
          Add-Content "$setup\content.json" ' '
          Check ((Install $contentHash) -eq 1 -and -not (Test-Path $dir)) 'an edited content.json is refused'
          Copy-Item "$withContent\content.json" $setup -Force
          Check ((Install $contentHash) -eq 0) 'a package with content.json installs'
          $tip = & "$dir\python\python.exe" -I -c "import sys; sys.path.insert(0, sys.argv[1]); import hello; print(hello.content_lists()[1][0])" $dir
          $sample = (Get-Content -Raw examples\content.json | ConvertFrom-Json).tips[0]
          Check ("$tip" -eq $sample) 'the installed program uses the organization content'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\uninstall.ps1" -Quiet | Write-Host
          Check ($LASTEXITCODE -eq 0 -and -not (Test-Path $dir)) 'the content install uninstalls'

          # -RemoveNotes deletes this profile's notes, and every reminder goes.
          Check ((Install $contentHash) -eq 0) 'it installs again'
          $notesDir = Join-Path $env:LOCALAPPDATA 'hello-world'
          New-Item -ItemType Directory $notesDir -Force | Out-Null
          Set-Content (Join-Path $notesDir 'notes.json') '{"visits": []}'
          Set-Content (Join-Path $notesDir 'keep-me.txt') 'not ours'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          # A fresh runner profile may not have the Run key yet.
          if (-not (Test-Path $run)) { New-Item $run | Out-Null }
          Set-ItemProperty $run -Name 'hello-world' -Value "`"$dir\python\pythonw.exe`" -I `"$dir\hello.py`" --startup"
          & "$dir\python\python.exe" -I -c "import sys; sys.path.insert(0, sys.argv[1]); import hello; print(hello.reminder_task('09:00'))" $dir
          powershell -NoProfile -ExecutionPolicy Bypass -File "$dir\uninstall.ps1" -Quiet -RemoveNotes | Write-Host
          Check ($LASTEXITCODE -eq 0) 'uninstall -RemoveNotes exits 0'
          Check (-not (Test-Path (Join-Path $notesDir 'notes.json')) -and (Test-Path (Join-Path $notesDir 'keep-me.txt'))) 'it deletes the notes and nothing else'
          Check ($null -eq (Get-ItemProperty $run -Name 'hello-world' -ErrorAction SilentlyContinue)) 'it removes the sign-in value'
          Check (-not (schtasks /Query /FO CSV /NH 2>$null | Select-String 'hello-world reminder')) 'it removes the reminder task'

          # The per-user install needs no administrator and stays in the profile.
          $userDir = Join-Path $env:LOCALAPPDATA 'Programs\hello-world'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$setup\install-user.ps1" -PackageHash $contentHash -Quiet | Write-Host
          Check ($LASTEXITCODE -eq 0) 'install-user exits 0'
          $ran = & "$userDir\python\python.exe" -I "$userDir\hello.py" --plain
          Check ("$ran" -eq 'Hello, world!') 'the per-user install runs'
          Check (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'hello-world.lnk')) "it is in this user's Start menu"
          Check (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\hello-world') "it is in this user's Apps list"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$userDir\uninstall-user.ps1" -Quiet | Write-Host
          Check ($LASTEXITCODE -eq 0 -and -not (Test-Path $userDir) -and -not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\hello-world')) 'uninstall-user removes it'
      # A dead URL or a wrong hash would pass every other check and fail every
      # real install at step 4, so run what the installer will run.
      - name: Check the pinned Python and run hello.py on it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Get-Content -Raw install.ps1
          $url = [regex]::Match($src, "(?m)^\`$pyUrl = '([^']+)'").Groups[1].Value
          $sha = [regex]::Match($src, "(?m)^\`$pySha256 = '([0-9A-Fa-f]{64})'").Groups[1].Value
          if (-not $url -or -not $sha) { throw 'Could not read $pyUrl and $pySha256 from install.ps1.' }
          $zip = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          Invoke-WebRequest $url -OutFile $zip -UseBasicParsing
          if ((Get-FileHash -LiteralPath $zip).Hash -ne $sha) { throw "The download from $url doesn't match the pinned SHA-256." }
          $py = Join-Path $env:RUNNER_TEMP 'python'
          Expand-Archive -LiteralPath $zip -DestinationPath $py
          $out = & (Join-Path $py 'python.exe') -I hello.py --plain
          if ($LASTEXITCODE -or "$out" -ne 'Hello, world!') { throw "hello.py --plain on the pinned Python gave exit $LASTEXITCODE`: $out" }
          $version = & (Join-Path $py 'python.exe') -I hello.py --version
          if ($version -ne "hello-world $((Get-Content VERSION).Trim())") { throw "--version gave '$version'." }
          # The zip's sigstore signature, from python.org's release manager for
          # the version, or the Windows release signer.
          Invoke-WebRequest "$url.sigstore" -OutFile "$zip.sigstore" -UseBasicParsing
          python -m pip install --quiet "sigstore>=3,<5"
          $signed = $false
          # sigstore reports on stderr, which 'Stop' would turn into a failure.
          $ErrorActionPreference = 'Continue'
          foreach ($who in @(@('hugo@python.org', 'https://github.com/login/oauth'), @('steve.dower@python.org', 'https://login.microsoftonline.com'))) {
            python -m sigstore verify identity --bundle "$zip.sigstore" --cert-identity $who[0] --cert-oidc-issuer $who[1] $zip 2>&1 | Write-Host
            if ($LASTEXITCODE -eq 0) { $signed = $true; Write-Host "ok: signed by $($who[0])"; break }
          }
          $ErrorActionPreference = 'Stop'
          if (-not $signed) { throw "The Python zip's sigstore signature didn't verify." }

  # Where AllSigned or WDAC script rules apply, only a signed package runs.
  # A throwaway certificate stands in for the organization's: the package is
  # signed with it, the machine is set to AllSigned, and the scripts run with
  # no -ExecutionPolicy Bypass. An unsigned package must be refused there.
  signed:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A signed package installs and uninstalls under AllSigned
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Check([bool]$Ok, [string]$What) { if (-not $Ok) { throw "Failed: $What" }; Write-Host "ok: $What" }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=hello-world CI signing' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          $cer = Join-Path $env:RUNNER_TEMP 'ci-signing.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null

          $pf = [Environment]::GetFolderPath('ProgramFiles')
          $dir = Join-Path $pf 'hello-world'
          function Build([string]$Name, [string[]]$Extra) {
            $out = Join-Path $env:RUNNER_TEMP $Name
            $hash = (powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-package.ps1 -OutDir $out @Extra | Select-Object -Last 1).Trim()
            $setup = Join-Path $pf $Name
            New-Item -ItemType Directory $setup | Out-Null
            icacls $setup /inheritance:r /grant:r '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-18:(OI)(CI)F' | Out-Null
            Copy-Item "$out\*" $setup
            return @{ Setup = $setup; Hash = $hash }
          }
          $signed = Build 'hello-setup-signed' @('-CertificateThumbprint', $cert.Thumbprint)
          $unsigned = Build 'hello-setup-unsigned' @()
          Check ((Get-AuthenticodeSignature "$($signed.Setup)\install.ps1").Status -eq 'Valid') 'the signed package carries a valid signature'
          Check ($signed.Hash -ne $unsigned.Hash) 'signing gives the package its own hash'

          Set-ExecutionPolicy Undefined -Scope CurrentUser -Force
          Set-ExecutionPolicy AllSigned -Scope LocalMachine -Force
          Check ((powershell -NoProfile -Command 'Get-ExecutionPolicy') -eq 'AllSigned') 'the machine is set to AllSigned'

          # The refusal arrives on stderr, which 'Stop' would turn into a
          # failure of this step instead of a result to check.
          $ErrorActionPreference = 'Continue'
          powershell -NoProfile -File "$($unsigned.Setup)\install.ps1" -PackageHash $unsigned.Hash -Quiet 2>&1 | Write-Host
          $refused = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          Check ($refused -ne 0 -and -not (Test-Path $dir)) 'an unsigned package is refused under AllSigned'

          powershell -NoProfile -File "$($signed.Setup)\install.ps1" -PackageHash $signed.Hash -Quiet | Write-Host
          Check ($LASTEXITCODE -eq 0) 'the signed package installs under AllSigned'
          Check ((Get-AuthenticodeSignature "$dir\uninstall.ps1").Status -eq 'Valid') 'the installed uninstaller is signed'
          Check ("$(& "$dir\python\python.exe" -I "$dir\hello.py" --plain)" -eq 'Hello, world!') 'the installed program runs'

          powershell -NoProfile -File "$dir\uninstall.ps1" -Quiet | Write-Host
          Check ($LASTEXITCODE -eq 0 -and -not (Test-Path $dir)) 'the signed uninstaller runs under AllSigned'
