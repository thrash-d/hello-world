# This repo's own copy, with actions pinned to a commit.
# .devkit/no-auto-workflows keeps the shared kit from replacing it.
#
# Tags main with v<version> once the tests have passed on that commit, when
# VERSION holds a version that has no tag yet.
name: auto-tag

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: |
          v=$(tr -d '[:space:]' < VERSION)
          [ -n "$v" ] || { echo "No version."; exit 0; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then echo "v$v already tagged."; exit 0; fi
          git tag "v$v" && git push origin "v$v"
